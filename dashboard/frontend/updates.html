<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Updates — NodeBox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="nav-brand" href="/">NodeBox</a>
    <a href="/">Dashboard</a>
    <a href="/connect.html">Connect</a>
    <a href="/updates.html" class="active">Updates</a>
    <a href="/mempool/" target="_blank">mempool</a>
    <a href="/pool/" target="_blank">pool</a>
  </nav>

  <main>
    <h1>Updates</h1>
    <div class="update-list" id="update-list">

      <div class="update-item" id="item-os">
        <div class="update-item-info">
          <h2>Debian</h2>
          <p id="ver-os">Checking for updates…</p>
        </div>
        <button class="btn btn-primary" onclick="restart()" id="btn-reboot" style="display:none">
          Restart
        </button>
        <button class="btn btn-primary" onclick="startUpdate('os')" disabled id="btn-os">
          Update
        </button>
        <div class="log-box" id="log-os"></div>
      </div>

      <div class="update-item" id="item-bitcoin-core">
        <div class="update-item-info">
          <h2>Bitcoin Core</h2>
          <p id="ver-bitcoin-core">Checking versions…</p>
        </div>
        <button class="btn btn-primary" onclick="startUpdate('bitcoin-core')" disabled id="btn-bitcoin-core">
          Update
        </button>
        <div class="log-box" id="log-bitcoin-core"></div>
      </div>

      <div class="update-item" id="item-fulcrum">
        <div class="update-item-info">
          <h2>Fulcrum</h2>
          <p id="ver-fulcrum">Checking versions…</p>
        </div>
        <button class="btn btn-primary" onclick="startUpdate('fulcrum')" disabled id="btn-fulcrum">
          Update
        </button>
        <div class="log-box" id="log-fulcrum"></div>
      </div>

      <div class="update-item" id="item-mempool">
        <div class="update-item-info">
          <h2>mempool.space</h2>
          <p id="ver-mempool">Checking versions…</p>
        </div>
        <button class="btn btn-primary" onclick="startUpdate('mempool')" disabled id="btn-mempool">
          Update
        </button>
        <div class="log-box" id="log-mempool"></div>
      </div>

      <div class="update-item" id="item-public-pool" style="display:none">
        <div class="update-item-info">
          <h2>Public Pool</h2>
          <p id="ver-public-pool">—</p>
        </div>
        <button class="btn btn-primary" onclick="startUpdate('public-pool')" disabled id="btn-public-pool">
          Update
        </button>
        <div class="log-box" id="log-public-pool"></div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
  <script>
    async function load() {
      const [status, updates, services, osInfo] = await Promise.all([
        fetchStatus(), fetchUpdates(), fetchServices(), fetchOs(),
      ]);

      showOs(osInfo);

      const installed = {
        'bitcoin-core': btcVersionStr(status?.bitcoin?.version),
        'fulcrum':      status?.fulcrum?.version?.replace(/^Fulcrum /, '') ?? null,
        'mempool':      status?.mempool?.version ?? null,
      };

      const latest = {
        'bitcoin-core': updates?.bitcoinCore ?? null,
        'fulcrum':      updates?.fulcrum     ?? null,
        'mempool':      updates?.mempool     ?? null,
      };

      for (const svc of ['bitcoin-core', 'fulcrum', 'mempool']) {
        const inst = installed[svc];
        const lat  = latest[svc];
        const el   = document.getElementById(`ver-${svc}`);
        const btn  = document.getElementById(`btn-${svc}`);

        if (lat) {
          el.textContent = inst
            ? `Installed: v${inst}  ·  Latest: v${lat}`
            : `Latest: v${lat}`;
          btn.disabled = inst === lat;
        } else {
          el.textContent = inst ? `Installed: v${inst}` : 'Version unavailable';
          btn.disabled = true;
        }
      }

      // Public Pool — optional, pinned-commit build (no release version).
      // Row only appears once installed; install is handled on the Dashboard.
      const pool = services && services['public-pool'];
      if (pool && pool.installed) {
        document.getElementById('item-public-pool').style.display = '';
        document.getElementById('ver-public-pool').textContent =
          'Installed: pinned build — rebuilds to the latest tested commit';
        document.getElementById('btn-public-pool').disabled = false;
      }

      // Pick up an update that is still running, e.g. after a page reload.
      const task = await fetchTask();
      const service = task?.running && task.name?.replace(/^update-/, '');
      if (service && document.getElementById(`log-${service}`)) {
        const btn = document.getElementById(`btn-${service}`);
        btn.disabled = true;
        await followTask(task.name, document.getElementById(`log-${service}`));
        await load();
      }
    }

    function showOs(info) {
      const btn = document.getElementById('btn-os');
      const pending = info?.pending;
      btn.disabled = !pending?.count;
      document.getElementById('btn-reboot').style.display = info?.rebootRequired ? '' : 'none';

      if (!pending) {
        setText('ver-os', 'Update status unavailable');
        return;
      }
      const parts = [pending.count
        ? `${pending.count} updates (${pending.security} security${pending.kernel ? ', new kernel' : ''})`
        : 'Up to date'];
      if (info.listsUpdatedAt) {
        parts.push(`Checked: ${new Date(info.listsUpdatedAt).toLocaleDateString()}`);
      }
      if (info.rebootRequired) parts.push('Restart required');
      setText('ver-os', parts.join('  ·  '));
    }

    async function startUpdate(service) {
      const btn = document.getElementById(`btn-${service}`);
      const log = document.getElementById(`log-${service}`);

      const warning = service === 'os'
        ? 'Install all Debian updates? Services may restart while this runs.'
        : `Update ${service}? The service will restart briefly.`;
      if (!confirm(warning)) return;

      btn.disabled = true;
      await startTask(`update-${service}`, log);
      await load();
    }

    async function restart() {
      if (!confirm('Restart NodeBox now? Everything is offline until it is back, usually for several minutes up to about 15.')) return;

      document.getElementById('btn-reboot').disabled = true;
      await startTask('reboot', document.getElementById('log-os'));
    }

    load();
  </script>
</body>
</html>
